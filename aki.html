        <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
        <button type="button" class="lang-btn" data-lang-btn="zh">中</button>
      </div>
    </div>
  </header>
  <main>
    <section class="project-hero-image project-hero-awarded">
      <img src="assets/headers/aki-header.jpg" alt="Aki Family header specimen" decoding="async">
      <aside class="award-corner award-corner-aki" tabindex="0" aria-label="Aki Family awards">
        <svg class="award-corner-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 4h8v3.2c0 3.4-1.6 5.6-4 6.3-2.4-.7-4-2.9-4-6.3V4Z"></path>
          <path d="M8 6H4.8c0 2.5 1.3 4.3 3.5 4.8"></path>
          <path d="M16 6h3.2c0 2.5-1.3 4.3-3.5 4.8"></path>
          <path d="M12 13.5V17"></path>
          <path d="M8.5 20h7"></path>
          <path d="M10 17h4"></path>
        </svg>
        <div class="award-corner-content">
          <img class="award-expanded-image" src="assets/awards/aki-awards-expanded.png" alt="Aki Family award logos" decoding="async" loading="lazy">
        </div>
      </aside>
    </section>
    <section class="meta-grid meta-grid-4col">
      <div><span><span class="i18n-en">Scripts</span><span class="i18n-zh">文字系统</span></span><strong><span class="i18n-en">Yi, Hanzi, Latin, Arabic</span><span class="i18n-zh">彝文、汉字、拉丁字母、阿拉伯文</span></strong></div>
      <div><span><span class="i18n-en">Award</span><span class="i18n-zh">获奖</span></span><strong>New York TDC x Young Ones 2025</strong></div>
      <div><span><span class="i18n-en">Designers</span><span class="i18n-zh">设计师</span></span><strong><span class="i18n-en">Yue CHEN, Congyu ZHANG</span><span class="i18n-zh">陈月、张丛馀</span></strong></div>
      <div><span><span class="i18n-en">Period</span><span class="i18n-zh">项目周期</span></span><strong><span class="i18n-en">October 2023 to present</span><span class="i18n-zh">2023年10月至今</span></strong></div>
    </section>
    <section class="tester" data-font-tester>
      <div class="tester-panel">
        <h2><span class="i18n-en">Type tester</span><span class="i18n-zh">字体测试</span></h2>
        <div class="tester-controls">
          <label><span class="i18n-en">Style</span><span class="i18n-zh">样式</span><select data-tester-font><option value="font-aki-roman">Roman</option><option value="font-aki-italic">Italic</option></select></label>
          <label class="range-control"><span class="range-name"><span class="i18n-en">Size</span><span class="i18n-zh">大小</span></span><input data-tester-size type="range" min="24" max="180" value="112"><input class="range-value" data-size-value type="number" min="24" max="180" value="112" aria-label="Size value"></label>
          <label class="range-control"><span class="range-name"><span class="i18n-en">Line height</span><span class="i18n-zh">行高</span></span><input data-tester-line type="range" min="80" max="180" value="105"><input class="range-value" data-line-value type="number" min="0.8" max="1.8" step="0.01" value="1.05" aria-label="Line height value"></label>
          <div class="segmented" data-align-controls>
            <button type="button" data-align="left" class="active" aria-label="Align left"><span class="align-icon align-left"><i></i><i></i><i></i></span></button>
            <button type="button" data-align="center" aria-label="Align center"><span class="align-icon align-center"><i></i><i></i><i></i></span></button>
            <button type="button" data-align="right" aria-label="Align right"><span class="align-icon align-right"><i></i><i></i><i></i></span></button>
          </div>
          <label class="toggle"><input type="checkbox" data-invert> <span class="i18n-en">Reverse</span><span class="i18n-zh">反色</span></label>
        </div>
      </div>
      <div class="tester-output"><div class="tester-text font-aki-roman" data-tester-output contenteditable="true">aki family</div></div>
    </section>
    <section class="image-grid">
      <img src="assets/details/aki-01.jpg" alt="Aki Family detailed specimen 1" decoding="async" loading="lazy">
      <img src="assets/details/aki-02.jpg" alt="Aki Family detailed specimen 2" decoding="async" loading="lazy">
    </section>
    <section class="specimen-carousel aki-specimen-carousel" data-specimen-carousel data-carousel-interval="2000" aria-label="Aki Family specimen carousel">
      <img class="active" src="assets/details/aki/aki-specimen-01.png" alt="Aki Family specimen 1" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-02.png" alt="Aki Family specimen 2" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-03.png" alt="Aki Family specimen 3" decoding="async" loading="lazy">

      <img src="assets/details/aki/aki-specimen-08.png" alt="Aki Family specimen 8" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-09.png" alt="Aki Family specimen 9" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-10.png" alt="Aki Family specimen 10" decoding="async" loading="lazy">

      <img src="assets/details/aki/aki-specimen-13.png" alt="Aki Family specimen 13" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-14.png" alt="Aki Family specimen 14" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-15.png" alt="Aki Family specimen 15" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-16.png" alt="Aki Family specimen 16" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-17.png" alt="Aki Family specimen 17" decoding="async" loading="lazy">
      <img src="assets/details/aki/aki-specimen-18.png" alt="Aki Family specimen 18" decoding="async" loading="lazy">
    </section>
    <section class="pager">
